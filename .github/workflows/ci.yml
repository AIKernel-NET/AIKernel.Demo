name: .NET CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  validate:
    name: .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AIKernel.Demo.slnx
      - name: Build
        id: build
        run: dotnet build AIKernel.Demo.slnx -c Release --no-restore
      - name: Test
        run: dotnet test AIKernel.Demo.slnx -c Release --no-build --no-restore
      - name: Pack
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet pack AIKernel.Demo.slnx -c Release --no-build --no-restore

  published-packages:
    name: Build with published packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build from NuGet.org
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/aikernel-demo-public-packages
        run: |
          dotnet restore AIKernel.Demo.slnx --configfile NuGet.config --source https://api.nuget.org/v3/index.json --no-http-cache -p:UseLocalPackageVersion=false
          dotnet build AIKernel.Demo.slnx -c Release --no-restore -p:UseLocalPackageVersion=false
